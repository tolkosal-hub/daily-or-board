    <script>
        const dateFilter = document.getElementById('dateFilter');
        const tableBody = document.getElementById('tableBody');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const syncIndicator = document.getElementById('syncIndicator');
        const errorMessage = document.getElementById('errorMessage');
        
        let scheduleData = [];
        const areas = ['OTS1', 'OTS2', 'OTS3'];
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrk6OuH81kLg4H0CA8j2mXxvYk3C1Ag-nLO09VUvM0BteaU5spvNRDtzTpDtXYkzo/exec';
        
        const tabClientId = Math.random().toString(36).substring(2, 15);

        const allowedEditors = [
            "admin@gmail.com",
            "maodara@gmail.com",
            "pichphirum@gmail.com",
            "phavphal@gmail.com",
            "voeunkong@gmail.com",
            "huotsocheat@gmail.com"
        ];

        function isUserAllowedToEdit() {
            return allowedEditors.includes(currentUserEmail);
        }

        function setDateToToday() {
            const localToday = new Date();
            const yyyy = localToday.getFullYear();
            const mm = String(localToday.getMonth() + 1).padStart(2, '0');
            const dd = String(localToday.getDate()).padStart(2, '0');
            dateFilter.value = `${yyyy}-${mm}-${dd}`;
        }
        
        setDateToToday();

        const formatDataDate = (raw) => {
            if (!raw) return '';
            let s = String(raw);
            if (s.includes('T')) {
                try {
                    let d = new Date(s);
                    let formatter = new Intl.DateTimeFormat('en-US', {
                        timeZone: 'Asia/Phnom_Penh',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                    let parts = formatter.formatToParts(d);
                    let y = parts.find(p => p.type === 'year').value;
                    let m = parts.find(p => p.type === 'month').value;
                    let dNum = parts.find(p => p.type === 'day').value;
                    return `${y}-${m}-${dNum}`;
                } catch(e) {
                    return s.substring(0, 10);
                }
            }
            return s.substring(0, 10);
        };

        function fetchSheetData(isSilent = false) {
            if (!isSilent) loadingIndicator.style.display = 'inline';
            if (isSilent) {
                syncIndicator.style.display = 'inline';
                setTimeout(() => syncIndicator.style.display = 'none', 3000);
            }
            errorMessage.style.display = 'none';

            fetch(APPS_SCRIPT_URL)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    let rows = Array.isArray(data) ? data : (data.data || data.records || []);
                    
                    scheduleData = rows.map((row, index) => {
                        const _id = 'row_' + index;
                        let rowDate = '';
                        let orTeam = '';
                        let selectedBy = ''; 

                        if (Array.isArray(row)) {
                             rowDate = formatDataDate(row[1]);
                             orTeam = String(row[18] || row[19] || ''); 
                             selectedBy = String(row[20] || ''); 
                        } else {
                             rowDate = formatDataDate(row['Date'] || row['date']);
                             orTeam = String(row['OR Team'] || row['orTeam'] || row['or_team'] || row['Anesthetic Team'] || row['anestheticTeam'] || row['anesthetic_team'] || row['OR Nurse'] || row['orNurse'] || row['or_nurse'] || '');
                             selectedBy = String(row['Selected By'] || row['selectedBy'] || row['selected_by'] || '');
                        }

                        if (orTeam === 'None') orTeam = '';
                        if (selectedBy === 'None') selectedBy = '';

                        if (Array.isArray(row)) {
                             return {
                                _id: _id,
                                backendId: String(row[0] || ''),
                                date: rowDate, 
                                area: String(row[2] || ''),
                                time: String(row[3] || ''),
                                patientId: String(row[4] || ''),
                                patientName: String(row[5] || ''),
                                age: String(row[6] || ''),
                                sex: String(row[7] || ''),
                                roomBed: String(row[8] || ''),
                                diagnosis: String(row[9] || ''),
                                procedure: String(row[10] || ''),
                                surgeon: String(row[11] || ''),
                                assistant: String(row[12] || ''),
                                specialInstruments: String(row[13] || ''),
                                remark: String(row[14] || ''),
                                orTeam: orTeam,
                                selectedBy: selectedBy,
                                status: String(row[17] || '')
                             };
                        } else {
                             return {
                                _id: _id,
                                backendId: String(row['Backend ID'] || row['backend_id'] || row['backendId'] || ''),
                                date: rowDate,
                                area: String(row['Area'] || row['area'] || ''),
                                time: String(row['Time'] || row['time'] || ''),
                                patientId: String(row['Patient ID'] || row['patientId'] || row['patient_id'] || ''),
                                patientName: String(row['Patient Name'] || row['patientName'] || row['patient_name'] || ''),
                                age: String(row['Age'] || row['age'] || ''),
                                sex: String(row['Sex'] || row['sex'] || ''),
                                roomBed: String(row['Room/Bed'] || row['roomBed'] || row['room_bed'] || ''),
                                diagnosis: String(row['Diagnosis'] || row['diagnosis'] || ''),
                                procedure: String(row['Procedure'] || row['procedure'] || ''),
                                surgeon: String(row['Surgeon'] || row['surgeon'] || ''),
                                assistant: String(row['Assistant'] || row['assistant'] || ''),
                                specialInstruments: String(row['Special Instruments'] || row['specialInstruments'] || row['special_instruments'] || ''),
                                remark: String(row['Remark'] || row['remark'] || ''),
                                orTeam: orTeam,
                                selectedBy: selectedBy,
                                status: String(row['Status'] || row['status'] || '')
                            };
                        }
                    });

                    loadingIndicator.style.display = 'none';
                    renderTable(dateFilter.value);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    loadingIndicator.style.display = 'none';
                    errorMessage.style.display = 'block';
                    errorMessage.innerHTML = `<strong>Error connecting to Google Apps Script.</strong> Details: ${error.message}`;
                });
        }

        db.collection("system").doc("sync_flag").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (data.client_id === tabClientId) {
                    return;
                }
                if (initialLoadComplete) {
                    fetchSheetData(true); 
                } else {
                    initialLoadComplete = true;
                }
            }
        });

// Helper function to check if a case is in the past
function isCaseInPast(dateStr, timeStr) {
    if (!dateStr || !timeStr) return false;
    
    const now = new Date();
    const [year, month, day] = dateStr.split('-').map(Number);
    
    // Extract hours and minutes (supports "HH:MM", "HH:MM AM", "HH:MM PM")
    const timeMatch = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/);
    
    if (!timeMatch) {
        // Fallback: If time string format is unknown, lock only if the whole day has passed
        const caseDateObj = new Date(year, month - 1, day, 23, 59, 59);
        return now > caseDateObj;
    }

    let hours = parseInt(timeMatch[1], 10);
    const minutes = parseInt(timeMatch[2], 10);
    const modifier = timeMatch[3] ? timeMatch[3].toUpperCase() : null;

    // Convert to 24-hour format if AM/PM is present
    if (modifier === 'PM' && hours < 12) hours += 12;
    if (modifier === 'AM' && hours === 12) hours = 0;

    const caseDateTime = new Date(year, month - 1, day, hours, minutes);
    return now > caseDateTime;
}

        function updateDropdown(rowId, fieldKey, newValue, selectElement) {
            const row = scheduleData.find(r => r._id === rowId);
            if (!row) return;

            const isAdmin = currentUserEmail === "admin@gmail.com";
            const isStaffUser = currentUserEmail === "staff@gmail.com";
            const currentDisplayName = document.getElementById('userDisplay').textContent;
            
            // If the row currently has a team selected
            const isTeamSelected = row[fieldKey] !== '' && row[fieldKey] !== 'None';
        
            // Constraint 0: Cannot edit past cases
            if (isCaseInPast(row.date, row.time)) {
                alert('Access Denied: Cannot modify team assignments for past cases.');
                selectElement.value = row[fieldKey] === '' ? 'None' : row[fieldKey];
                return;
            }

            // Constraint 1: Staff user can never edit
            if (isStaffUser) {
                alert('Access Denied: Staff cannot modify team assignments.');
                selectElement.value = row[fieldKey] === '' ? 'None' : row[fieldKey];
                return;
            }

            // Constraint 2: Only allowed editors can make changes
            if (!isUserAllowedToEdit()) {
                alert('You do not have permission to modify staff assignments.');
                selectElement.value = row[fieldKey] === '' ? 'None' : row[fieldKey];
                return;
            }

            // Constraint 3: If a team is ALREADY selected, only Admin or the original selector can change it
            if (isTeamSelected) {
                if (!isAdmin && row.selectedBy !== currentDisplayName) {
                    alert('Access Denied: Only Admin or the user who assigned the team can change it.');
                    selectElement.value = row[fieldKey] === '' ? 'None' : row[fieldKey];
                    return;
                }
            }

            row[fieldKey] = (newValue === 'None') ? '' : newValue;
            row.selectedBy = currentDisplayName;

            const originalBg = selectElement.style.backgroundColor;
            selectElement.style.backgroundColor = '#e8f4fd'; 

            const payload = {
                __backendId: row.backendId,
                date: row.date,
                operating_area: row.area,
                time: row.time,
                patient_id: row.patientId,
                patient_name: row.patientName,
                age: row.age,
                sex: row.sex,
                room_bed: row.roomBed,
                diagnosis: row.diagnosis,
                procedure: row.procedure,
                surgeon: row.surgeon,
                assistant: row.assistant,
                special_instruments: row.specialInstruments,
                remark: row.remark,
                anesthetic_team: row.orTeam === '' ? 'None' : row.orTeam,
                or_nurse: row.orTeam === '' ? 'None' : row.orTeam,
                or_team: row.orTeam === '' ? 'None' : row.orTeam,
                status: row.status,
                selected_by: currentDisplayName
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    selectElement.style.backgroundColor = '#d4edda'; 
                    setTimeout(() => selectElement.style.backgroundColor = originalBg, 2000);
                    
                    db.collection("system").doc("sync_flag").set({
                        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
                        updated_by: currentUserEmail,
                        client_id: tabClientId 
                    });
                    
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                console.error('Save failed:', err);
                alert('Failed to save assignment. Please check connection.');
                selectElement.style.backgroundColor = '#f8d7da'; 
            });
        }

        function renderTable(selectedDate) {
            tableBody.innerHTML = ''; 
            
            const filteredData = scheduleData.filter(row => row.date === selectedDate);
            
            const isAdmin = currentUserEmail === "admin@gmail.com";
            const isStaffUser = currentUserEmail === "staff@gmail.com";
            const currentDisplayName = document.getElementById('userDisplay').textContent;

            areas.forEach(area => {
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `<td colspan="13" class="area-header">${area}</td>`;
                tableBody.appendChild(headerRow);

                let areaData = filteredData.filter(row => row.area === area);

                if (areaData.length === 0) {
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = `<td colspan="13" class="no-data">No surgeries scheduled in ${area}.</td>`;
                    tableBody.appendChild(emptyRow);
                } else {
                    areaData.sort((a, b) => {
                        return a.time.localeCompare(b.time);
                    });

                    areaData.forEach(row => {
                        const tr = document.createElement('tr');
                        
                        let statusClass = '';
let statusHtml = row.status; // Default to just the text
const statusVal = row.status.trim().toLowerCase();

if (statusVal === 'finished') {
    statusClass = 'status-finished';
} else if (statusVal === 'pending') {
    statusClass = 'status-pending';
} else if (statusVal === 'in progress') {
    statusClass = 'status-in-progress';
    statusHtml = `<span class="blinking-dot"></span>${row.status}`;
}


                        let isRowLocked = false;
const isTeamSelected = row.orTeam !== '' && row.orTeam !== 'None';
const pastCase = isCaseInPast(row.date, row.time);

// Apply locking logic based on rules
if (pastCase) {
    isRowLocked = true; // Lock for EVERYONE if the date and time have passed
} else if (isStaffUser) {
    isRowLocked = true; // Staff can never edit
} else if (!isUserAllowedToEdit()) {
    isRowLocked = true; // Non-editors cannot edit
} else if (isTeamSelected) {
    // If a team is assigned, only Admin or the original selector can change it
    if (!isAdmin && row.selectedBy !== currentDisplayName) {
        isRowLocked = true;
    }
}


             const disabledAttr = isRowLocked ? 'disabled title="Restricted assignment"' : '';

                        const surgeonTeamHtml = `
                            <div class="surgeon-team-container">
                                <div class="surgeon-sub-row" style="border-bottom: 1px dashed #eee; padding-bottom: 4px;">
                                    <span class="surgeon-value">${row.surgeon || ''}</span>
                                </div>
                                <div class="surgeon-sub-row" style="padding-top: 2px;">
                                    <span class="surgeon-value">${row.assistant || ''}</span>
                                </div>
                            </div>
                        `;

                        const orTeamHtml = `
                            <select ${disabledAttr} onchange="updateDropdown('${row._id}', 'orTeam', this.value, this)">
                                <option value="None" ${row.orTeam === '' ? 'selected' : ''}>Select Team</option>
                                <option value="Team A" ${row.orTeam === 'Team A' ? 'selected' : ''}>Team A</option>
                                <option value="Team B" ${row.orTeam === 'Team B' ? 'selected' : ''}>Team B</option>
                                <option value="Team C" ${row.orTeam === 'Team C' ? 'selected' : ''}>Team C</option>
                            </select>
                        `;

                        tr.innerHTML = `
                            <td>${row.time}</td>
                            <td>${row.patientId}</td>
                            <td>${row.patientName}</td>
                            <td>${row.age}</td>
                            <td>${row.sex}</td>
                            <td>${row.roomBed}</td>
                            <td>${row.diagnosis}</td>
                            <td>${row.procedure}</td>
                            <td>${surgeonTeamHtml}</td>
                            <td>${row.specialInstruments}</td>
                            <td>${row.remark}</td>
                            <td>${orTeamHtml}</td>
                            <td class="${statusClass}">${statusHtml}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }
            });
        }

        function exportToPDF() {
            const btn = document.getElementById('exportPdfBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'Generating...';
            btn.disabled = true;

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'pt', 'a4'); 

                // 1. Add font to Virtual File System
                doc.addFileToVFS('KhmerFont.ttf', fontBase64);
                
                // 2. Register font and set it active
                doc.addFont('KhmerFont.ttf', 'KhmerFont', 'normal');
                doc.setFont('KhmerFont');

                const dateStr = document.getElementById('dateFilter').value || 'schedule';

                // 3. Render Khmer text titles safely
                doc.setFontSize(16);
                doc.text("Battambang Provincial Referral Hospital", doc.internal.pageSize.getWidth() / 2, 40, { align: 'center' });
                doc.setFontSize(14);
                doc.text("Operating Theater - Daily Surgery Schedule", doc.internal.pageSize.getWidth() / 2, 60, { align: 'center' });
                doc.setFontSize(11);
                doc.text(`Date: ${dateStr}`, doc.internal.pageSize.getWidth() / 2, 80, { align: 'center' });

                const filteredData = scheduleData.filter(row => row.date === dateStr);
                let tableRows = [];

                areas.forEach(area => {
                    let areaData = filteredData.filter(row => row.area === area);
                    
                    tableRows.push([{ content: area, colSpan: 13, styles: { halign: 'center', fillColor: [189, 195, 199], textColor: [44, 62, 80], fontStyle: 'bold' } }]);
                    
                    if (areaData.length === 0) {
                        tableRows.push([{ content: `No surgeries scheduled in ${area}.`, colSpan: 13, styles: { halign: 'center', fontStyle: 'italic', textColor: [127, 140, 141] } }]);
                    } else {
                        areaData.sort((a, b) => a.time.localeCompare(b.time));
                        areaData.forEach(row => {
                            tableRows.push([
                                row.time, row.patientId, row.patientName, row.age, row.sex, row.roomBed,
                                row.diagnosis, row.procedure, [row.surgeon, row.assistant].filter(Boolean).join('\n'), row.specialInstruments,
                                row.remark, row.orTeam || 'None', row.status
                            ]);
                        });
                    }
                });

                               // 4. Generate the AutoTable with column-specific font styling
                doc.autoTable({
                    head: [['Time', 'ID', 'Name', 'Age', 'Sex', 'Room/Bed', 'Diagnosis', 'Procedure', 'Surgeon Team', 'Instruments', 'Remark', 'OR Team', 'Status']],
                    body: tableRows,
                    startY: 95,
                    styles: { 
                        font: 'KhmerFont', // Default fallback font for the table
                        fontSize: 8, 
                        cellPadding: 4, 
                        lineWidth: 0.5, 
                        lineColor: [0, 0, 0] 
                    },
                    headStyles: { 
                        fillColor: [52, 73, 94], 
                        textColor: 255, 
                        halign: 'center',
                        fontStyle: 'normal'
                    },
                    // Target the Patient Name column (Index 2) specifically
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 2) {
                            data.cell.styles.font = 'KhmerFont'; // Ensures Noto Sans Khmer is forced here
                        }
                    },
                    theme: 'grid',
                    margin: { top: 30, right: 20, bottom: 30, left: 20 }
                });

                doc.save(`OR_Schedule_${dateStr}.pdf`);
                
            } catch (err) {
                console.error("PDF generation error: ", err);
                alert("Failed to export PDF. Check console.");
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

         function exportToCSV() {
            const dateStr = document.getElementById('dateFilter').value || 'schedule';
            const filteredData = scheduleData.filter(row => row.date === dateStr);
            
            // Convert dateStr (yyyy-mm-dd) to displayDate (dd-mm-yyyy)
            let displayDate = dateStr;
            if (dateStr !== 'schedule' && dateStr.includes('-')) {
                const [year, month, day] = dateStr.split('-');
                displayDate = `${day}-${month}-${year}`;
            }

            // Add UTF-8 BOM so Excel automatically recognizes Khmer characters
            let csvContent = "\uFEFF"; 
            
            // --- TABLE TITLES ---
            csvContent += "មន្ទីរពេទ្យបង្អែកខេត្តបាត់ដំបង\n";
            csvContent += "ផ្នែក សល្យាគារ\n";
            csvContent += "កម្មវិធីវះកាត់ប្រចាំថ្ងៃ\n";
            csvContent += `Date: ${displayDate}\n\n`; // Uses the new dd-mm-yyyy format

            // CSV Headers
            csvContent += "Area,Time,Patient ID,Patient Name,Age,Sex,Room/Bed,Diagnosis,Procedure,Surgeon Team,OR Team\n";

            // Loop through areas to maintain the same grouping as the visual table
            areas.forEach(area => {
                let areaData = filteredData.filter(row => row.area === area);
                
                if (areaData.length > 0) {
                    areaData.sort((a, b) => a.time.localeCompare(b.time));
                    
                    areaData.forEach(row => {
                        // Standard escape for normal fields
                        const escapeCsv = (val) => `"${String(val).replace(/"/g, '""')}"`;
                        
                        // SPECIAL FORMAT: Forces Excel to treat the value strictly as text
                        const forceExcelText = (val) => `="${String(val).replace(/"/g, '""')}"`;
                        
                        // Map each column individually
                        const rowArray = [
                            escapeCsv(area),
                            escapeCsv(row.time),
                            escapeCsv(row.patientId),
                            escapeCsv(row.patientName),
                            escapeCsv(row.age),
                            escapeCsv(row.sex),
                            forceExcelText(row.roomBed), // Applied the anti-date formatting here
                            escapeCsv(row.diagnosis),
                            escapeCsv(row.procedure),
                            escapeCsv([row.surgeon, row.assistant].filter(Boolean).join('\n')),
                            escapeCsv(row.orTeam || 'None')
                        ];
                        
                        csvContent += rowArray.join(",") + "\n";
                    });
                }
            });

            // Create and trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            // Uses the new dd-mm-yyyy format for the downloaded filename as well
            link.setAttribute("download", `OR_Schedule_${displayDate}.csv`); 
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        dateFilter.addEventListener('change', (e) => {
            renderTable(e.target.value);
        });

        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
